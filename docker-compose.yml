services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aazadi
      POSTGRES_USER: aazadi
      POSTGRES_PASSWORD: aazadi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aazadi -d aazadi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://aazadi:aazadi@postgres:5432/aazadi
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  uploads:
