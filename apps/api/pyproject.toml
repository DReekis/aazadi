[project]
name = "aazadi-api"
version = "0.1.0"
description = "AAZADI FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.17.2",
  "email-validator==2.3.0",
  "fastapi==0.136.1",
  "psycopg[binary]==3.3.2",
  "pydantic-settings==2.14.1",
  "pwdlib[argon2]==0.3.0",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "SQLAlchemy==2.0.49",
  "uvicorn[standard]==0.38.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.1",
  "ruff==0.14.6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
